name: Build

on:
  push:
    branches:
      - 26.2/dev
  pull_request:
    branches:
      - 26.2/dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Upload user JAR
        uses: actions/upload-artifact@v7
        with:
          name: immersive-helper-build
          path: |
            output/immersive-helper-*.jar
            !output/immersive-helper-*-sources.jar
          if-no-files-found: error
